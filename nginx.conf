# Preserve HTTPS from the trusted public-facing reverse proxy.
map $http_x_forwarded_proto $store_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

# Restrict access to the published port to the trusted outer proxy.
map $http_x_forwarded_for $store_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

# Follow app container IP changes without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream store_app {
    zone store_app 64k;
    server app:80 resolve;
}

server {
    listen 80;
    server_name _;

    # Preserve the application's existing upload size policy.
    client_max_body_size 0;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_min_length 256;
    gzip_comp_level 5;
    # text/html is compressed by default; binary downloads are left as-is.
    gzip_types text/plain text/css text/javascript application/javascript
               application/xml text/xml application/rss+xml image/svg+xml;

    location / {
        proxy_pass http://store_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $store_forwarded_proto;
        proxy_set_header X-Forwarded-For $store_forwarded_for;
    }
}
