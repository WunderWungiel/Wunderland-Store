{% extends "base.html" %}

{% block title %}Rate {{ item['title'] }} • Wunderland Store{% endblock %}

{% block content %}
            <div id="views">
                <div class="view">
                    <div class="contentItem">
                        <h1>Rate {{ item['title'] }}</h1>
                        <div id="rateField">
                            <form action="{{ url_for('store.rate', content_id=item['id']) }}" method="post" id="rateForm">
                                <fieldset>
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                    {% for n in range(1, 6) %}
                                    <label>
                                        <input type="radio" name="rating" value="{{ n }}"/>
                                        {{ n }} star{% if n > 1 %}s{% endif %}
                                    </label>
                                    {% endfor %}
                                    <br/>
                                    <input type="submit" class="Btn" value="Rate"/>
                                </fieldset>
                            </form>
                        </div>
                    </div>

                    <div class="homeLink">
                        <a href="{{ url_for('store.root') }}">Home</a>
                    </div>

                    <div class="beacon"></div>
                </div>
            </div>
{% endblock %}
