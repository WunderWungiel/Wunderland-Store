{% extends "base.html" %}

{% set noindex = true %}

{% block title %}Search • Wunderland Store{% endblock %}

{% block content %}
            <div id="views">
                <div class="view">
                    <div class="contentItem">
                        <h1>Search</h1>
                        <div id="searchField">
                            <form action="{{ url_for('store.search') }}" method="get" id="searchForm">
                                <fieldset>
                                    <input type="text" id="search" name="query" size="15" style="width: 63%; max-width: 300px;"/>
                                    <input type="submit" id="searchBtn" value="Search"/>
                                </fieldset>
                            </form>
                        </div>
                    </div>

                    <div class="homeLink">
                        <a href="{{ url_for('store.root') }}">Home</a>
                    </div>

                    <div class="beacon"></div>
                </div>
            </div>
{% endblock %}
