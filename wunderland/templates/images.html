{% extends "base.html" %}

{% block title %}Screenshots • Wunderland Store{% endblock %}

{% block content %}
            <div id="views">
                <div class="view">
                    <div class="contentItem">
                        {% for screenshot in item['screenshots'] %}
                        <a href="{{ url_for('content', filename='screenshots/' ~ screenshot) }}">
                            <img src="{{ url_for('content', filename='screenshots/' ~ screenshot) }}" alt="{{ item['title'] }}"/>
                        </a>
                        {% endfor %}
                        <div class="options">
                            <a href="{{ url_for('store.item', content_id=item['id']) }}">&lt; Back to {{ item['title'] }}</a>
                        </div>
                    </div>
                    <div class="beacon"></div>
                </div>
            </div>
{% endblock %}
