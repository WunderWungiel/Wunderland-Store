{% extends "base.html" %}

{% set noindex = true %}

{% block title %}Upload • Wunderland Store{% endblock %}

{% block content %}
            <div id="views">
                <div class="view">
                    <div class="contentItem">
                        <h1>Upload</h1>
                        <div id="uploadField">
                            <form action="{{ url_for('store.upload') }}" method="POST" class="Form" enctype="multipart/form-data">
                                <fieldset>
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                                    <label for="prefix">Prefix: </label>
                                    <input type="text" id="prefix" name="prefix"/>
                                    <label for="name">Title: </label>
                                    <input type="text" id="title" name="title"/>
                                    <label for="file">File: </label>
                                    <input type="file" id="file" name="file"/>
                                    <label for="latest_url">Latest release URL: </label>
                                    <input type="text" id="latest_url" name="latest_url"/>
                                    <label for="category_id">Category: </label>
                                    <select id="category_id" name="category_id">
                                        {% for category in categories %}
                                        <option value="{{ category['id'] }}">{{ category['content_type']['name'] }} / {{ category['name'] }}</option>
                                        {% endfor %}
                                    </select>
                                    <label for="description">Description: </label>
                                    <textarea id="description" name="description"></textarea>
                                    <label for="publisher">Publisher: </label>
                                    <input type="text" id="publisher" name="publisher"/>
                                    <label for="version">Version: </label>
                                    <input type="text" id="version" name="version"/>
                                    <label for="platforms">Platforms: </label>
                                    <select id="platforms" name="platforms" multiple="multiple">
                                        {% for platform in platforms %}
                                        <option value="{{ platform['id'] }}">{{ platform['name'] }}</option>
                                        {% endfor %}
                                    </select>
                                    <label for="icon">Icon: </label>
                                    <input type="file" id="icon" name="icon"/>
                                    <label for="screenshots">Screenshots: </label>
                                    <input type="file" id="screenshots" name="screenshots" multiple="multiple"/>
                                    <label for="addon_text">Extra file text: </label>
                                    <textarea id="addon_text" name="addon_text"></textarea>
                                    <label for="addon_file">Extra file: </label>
                                    <input type="file" id="addon_file" name="addon_file"/>
                                    <br/><br/>
                                    <input type="submit" class="Btn" value="Upload"/>
                                </fieldset>
                            </form>
                        </div>
                    </div>

                    <div class="homeLink">
                        <a href="{{ url_for('store.root') }}">Home</a>
                    </div>

                    <div class="beacon"></div>
                </div>
            </div>
{% endblock %}
