services:
  app:
    image: wunderland-store
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      TZ: ${TZ:-Etc/UTC}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-8}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config.yaml:/srv/config.yaml:ro
      - ./content:/srv/content
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  # Deletes expired unconfirmed users and sessions once a day.
  clean:
    # The image is built by the app service.
    image: wunderland-store
    pull_policy: never
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: sh -c "while true; do flask --app wunderland.app clean; sleep 86400; done"
    init: true
    environment:
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config.yaml:/srv/config.yaml:ro
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Probes through nginx to the app, so it also checks the proxying.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    # Over TCP, because on a fresh volume the server that loads schema.sql
    # only listens on the Unix socket and would already pass a socket check.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  db_data:
