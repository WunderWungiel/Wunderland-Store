services:
  app:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./config.yaml:/srv/config.yaml:ro
      - ./content:/srv/content
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/healthz"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Deletes expired unconfirmed users and sessions once a day.
  clean:
    build: .
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: sh -c "while true; do flask --app wunderland.app clean; sleep 86400; done"
    init: true
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./config.yaml:/srv/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
    restart: unless-stopped

volumes:
  db_data:
