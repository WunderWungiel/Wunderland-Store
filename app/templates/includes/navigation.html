                <div id="navigation">
                    <a class="first{% if home_selected|default(false) %} selected{% endif %}" href="{{ url_for('store.root') }}">Home</a> <b>|</b>
                    {% for _content_type in get_content_types() %}
                    <a href="{{ url_for('store.content', content_type_id=_content_type['id']) }}"{% if selected_content_type is defined %} class="{{ 'selected' if selected_content_type == _content_type['id'] }}"{% endif %}>{{ _content_type['name'] }}</a>
                    {% if not loop.last %}<b>|</b>{% endif %}
                    {% endfor %}
                </div>
